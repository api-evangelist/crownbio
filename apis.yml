aid: crownbio
name: crownbio
description: >-
  Crown Bioscience (CrownBio) is a global contract research organization (CRO)
  specializing in translational oncology and immuno-oncology drug discovery. It
  provides preclinical and translational services to biotech and pharmaceutical
  companies, including in vitro drug screening (cell lines, organoids, panels),
  in vivo studies (PDX, CDX, syngeneic and humanized models), DMPK/toxicology,
  preclinical imaging, and biomarker analysis spanning genomics (NGS, single-cell
  sequencing), proteomics, spatial biology, and flow cytometry. CrownBio also
  operates public web-browsable cancer-model databases — a PDX Model Database
  (2,500+ models), an Organoid Models Database (600+ models), an IO Murine Models
  Database, and a Cell Line / CDX Database — searchable through a Multi-Model
  Search interface. There is no public developer API or programmatic data access;
  the databases are web interfaces. This profile was surfaced as a portfolio
  company of Qiming Venture Partners and enriched by the API Evangelist pipeline.
